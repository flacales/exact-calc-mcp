name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支上的重复推送取消旧任务，但 main 上每次合并都保留自己的记录
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # 全矩阵 12 组，macOS 只留两个版本，省一半额度
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      # C++ 引擎是可选组件。装了编译器，测试里的交叉验证分支才会真正跑到。
      - name: Install g++ (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # 44 个用例：38 个引擎用例 + 6 个 MCP 协议用例
      # （协议用例会真的起子进程跑一遍 stdio JSON-RPC 握手）
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          exact-calc "0.1 + 0.2"
          exact-calc --json "1/3 + 1/6"
          exact-calc --compare "0.1 + 0.2" "0.3"
          exact-calc --doctor
          exact-calc --version

      - name: Check the package builds
        run: |
          python -m pip install --upgrade build
          python -m build
