name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify the wheel contains the package
        run: |
          python -m pip install dist/*.whl
          python -c "import exact_calc_mcp; print(exact_calc_mcp.__version__)"
          exact-calc "0.1 + 0.2"

      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment: release
    permissions:
      # Trusted Publishing：不需要在仓库里存 PyPI token
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 重跑时跳过已上传的文件，而不是直接报错
          skip-existing: true
